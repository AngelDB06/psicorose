apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # El servidor de Let's Encrypt
    server: https://acme-v02.api.letsencrypt.org/directory
    # Tu correo para notificaciones
    email: angel@ejemplo.com 
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: traefik
