name: Generate Documentation

on:
  push:
    branches: [ main, develop ]

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso explícito para poder subir la documentación
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JSDoc and Plugins
        run: npm install jsdoc jsdoc-babel @babel/core @babel/preset-react
      - name: Generate Backend Docs
        run: npx jsdoc -c backend/jsdoc.json
      - name: Generate Frontend Docs
        run: npx jsdoc -c frontend/jsdoc.json
      - name: Commit and Push Docs
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add docs/
          git commit -m "docs: automatic documentation generation [skip ci]" || echo "No changes to commit"
          git push
