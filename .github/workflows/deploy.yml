name: CI/CD Pipeline - PsicoRose

on:
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (Backend)
        run: cd backend && npm install
      - name: Run Tests
        run: cd backend && npm test || echo "No tests defined yet"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: true
          # Convert repository name to lowercase for Docker
          tags: |
            ghcr.io/${{ github.repository_owner }}/psicorose-backend:latest
          # We use github.repository_owner and manually type lowercase name to avoid errors
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: infrastructure/docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/psicorose-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy K8s manifests to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infrastructure/k8s/*.yaml"
          target: "~/psicorose-deploy"
          strip_components: 2

      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Convert owner to lowercase for the sed command
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Update image tags in manifests
            sed -i "s|placeholder/psicorose-backend:latest|ghcr.io/${OWNER_LC}/psicorose-backend:latest|g" ~/psicorose-deploy/backend-deployment.yaml
            sed -i "s|placeholder/psicorose-frontend:latest|ghcr.io/${OWNER_LC}/psicorose-frontend:latest|g" ~/psicorose-deploy/frontend-deployment.yaml
            sed -i "s|IP_PUBLICA|${{ secrets.EC2_HOST }}|g" ~/psicorose-deploy/ingress.yaml
            
            # Apply manifests
            sudo kubectl apply -f ~/psicorose-deploy/
            
            # Force rollout
            sudo kubectl rollout restart deployment/backend -n psicorose
            sudo kubectl rollout restart deployment/frontend -n psicorose
