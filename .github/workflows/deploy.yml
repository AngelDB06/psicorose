name: CI/CD Pipeline - PsicoRose

on:
  push:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (Backend)
        run: cd backend && npm install
      - name: Run Tests
        env:
          MONGODB_URI: mongodb://localhost:27017/psicorose_test
          JWT_SECRET: test_secret_key
          NODE_ENV: test
        run: cd backend && npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Paso crítico: Convertir el nombre de usuario a minúsculas
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: infrastructure/docker/backend.Dockerfile
          push: true
          # Usamos la variable de entorno OWNER_LC que acabamos de crear
          tags: ghcr.io/${{ env.OWNER_LC }}/psicorose-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: infrastructure/docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/psicorose-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Copy K8s manifests to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "infrastructure/k8s/*.yaml"
          target: "~/psicorose-deploy"
          strip_components: 2

      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Usamos la variable de entorno que pasaremos en el paso de SSH
            OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            
            # Update image tags in manifests
            sed -i "s|placeholder/psicorose-backend:latest|ghcr.io/${OWNER_LC}/psicorose-backend:latest|g" ~/psicorose-deploy/backend-deployment.yaml
            sed -i "s|placeholder/psicorose-frontend:latest|ghcr.io/${OWNER_LC}/psicorose-frontend:latest|g" ~/psicorose-deploy/frontend-deployment.yaml
            
            # Apply manifests
            sudo kubectl apply -f ~/psicorose-deploy/
            
            # Force rollout
            sudo kubectl rollout restart deployment/backend -n psicorose
            sudo kubectl rollout restart deployment/frontend -n psicorose
